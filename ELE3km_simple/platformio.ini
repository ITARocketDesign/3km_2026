; ELE3km_simple — firmware de último recurso (ver Docs/ELE3km_simple_PRD.md)
;
; Dois ambientes, como no ELE3km:
;   native  — suíte do núcleo puro (src/core), roda no notebook, sem Arduino
;   heltec  — target real (Heltec WiFi LoRa 32 V2)
;
; O núcleo em src/core é compilado pelos dois ambientes. A HAL (src/hal) e o
; src/main.cpp só entram no build do target. As dependências de rádio e cartão
; (RadioLib, SdFat) entram junto com a HAL na issue 02.

[platformio]
default_envs = heltec_wifi_lora_32_V2

[env]
build_flags =
    -Isrc
    -Iinclude

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
build_flags = ${env.build_flags}
; a suíte é nativa; não faz sentido gravá-la na placa
test_ignore = test_*

[env:native]
platform = native
test_framework = unity
; só o núcleo puro; nada de src/main.cpp nem de src/hal
build_src_filter = +<core/>
test_build_src = yes
build_flags =
    ${env.build_flags}
    -std=c++17
    -Wall
    -Wextra
