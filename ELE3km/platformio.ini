; ELE3km — firmware do computador de bordo
;
; Dois ambientes, como pede a user story 106:
;   native  — suíte do núcleo puro (src/core), roda no notebook, sem Arduino
;   heltec  — target real (Heltec WiFi LoRa 32 V2)
;
; O núcleo em src/core é compilado pelos dois ambientes. A HAL (src/hal) e o
; src/main.cpp só entram no build do target: são a única parte que toca Arduino.

[platformio]
default_envs = heltec_wifi_lora_32_V2

[env]
build_flags =
    -Isrc
    -Iinclude

[env:heltec_wifi_lora_32_V2]
platform = espressif32
board = heltec_wifi_lora_32_V2
framework = arduino
monitor_speed = 115200
; SdFat, e não a biblioteca SD do Arduino: pré-alocação e arquivo contíguo são o
; mecanismo inteiro de integridade do log (hardware_constraints §C4), e a SD
; padrão não suporta nenhum dos dois.
lib_deps =
    jgromes/RadioLib@^7.7.1
    greiman/SdFat@^2.3.0
build_flags = ${env.build_flags}
; a suíte é nativa; não faz sentido gravá-la na placa
test_ignore = test_*

[env:native]
platform = native
test_framework = unity
; só o núcleo puro; nada de src/main.cpp nem de src/hal
build_src_filter = +<core/>
test_build_src = yes
build_flags =
    ${env.build_flags}
    -std=c++17
    -Wall
    -Wextra
    ; a suíte do ring buffer (issue 05) roda produtor e consumidor em threads de host
    -pthread
